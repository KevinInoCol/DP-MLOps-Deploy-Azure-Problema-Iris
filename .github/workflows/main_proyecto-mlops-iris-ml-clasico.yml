name: Build and deploy Python app to Azure Web App - proyecto-mlops-iris-ml-clasico

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Las dependencias se instalan AQUI, no en Azure: el plan B1 (1 core /
      # 1.75 GB) reinicia el contenedor SCM por OOM al compilar numpy+sklearn.
      # App Service anade .python_packages/lib/site-packages al PYTHONPATH solo.
      - name: Install dependencies into .python_packages
        run: |
          python -m pip install --upgrade pip
          pip install --target=".python_packages/lib/site-packages" -r requirements.txt

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          include-hidden-files: true
          path: |
            .
            !.git/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'proyecto-mlops-iris-ml-clasico'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AzureAppService_PublishProfile_a718c2885e9d4f0f850e405f47533b8a }}
