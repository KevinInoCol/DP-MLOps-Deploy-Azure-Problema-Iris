# Despliegue de la app Flask (Problema Iris) a Azure App Service.
#
# POR QUE ESTE WORKFLOW Y NO EL QUE GENERA `az webapp deployment github-actions add`:
# ese template usa azure/appservice-build@v2, que corre un Oryx de 2020 en un
# contenedor con glibc viejo. Con Python 3.11 falla asi:
#     python3.11: /lib/x86_64-linux-gnu/libm.so.6: version `GLIBC_2.29' not found
# Aqui se compila en el runner y Oryx construye EN LA PLATAFORMA de App Service
# (requiere SCM_DO_BUILD_DURING_DEPLOYMENT=true en la Web App).

name: Build and deploy Python app to Azure Web App - ML-Clasificacion-Iris-Flask

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Valida que las dependencias instalan antes de desplegar.
      # Si esto falla, el problema esta en requirements.txt, no en Azure.
      - name: Create and start virtual environment and install dependencies
        run: |
          python -m venv antenv
          source antenv/bin/activate
          pip install -r requirements.txt

      # antenv se excluye: Oryx reinstala las dependencias en la plataforma.
      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            .
            !antenv/

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'ml-clasificacion-iris-flask'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_76CB2DBDB5BF4CA7A157660DDB1E4DE6 }}
